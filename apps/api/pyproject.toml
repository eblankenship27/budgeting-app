[project]
name = "budgeting-api"
version = "0.1.0"
description = "Budgeting app FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "boto3>=1.43.123",
    "email-validator>=2.3.0",
    "fastapi>=0.136.1",
    "mangum>=0.21.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "sqlalchemy>=2.0.49",
]

[dependency-groups]
dev = [
    "boto3-stubs[rds]>=1.43.123",
    "faker>=40.44.0",
    "httpx>=0.28.1",
    "mypy>=2.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
    "uvicorn[standard]>=0.54.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
]

[tool.mypy]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
filterwarnings = [
    # Mangum 0.21 probes for an event loop at import; it handles the future RuntimeError itself.
    "ignore:There is no current event loop:DeprecationWarning:mangum.adapter",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
